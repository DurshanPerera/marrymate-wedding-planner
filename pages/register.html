<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MarryMate</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/register.css">
</head>
<body>

<!-- BUBBLE BACKGROUND -->
<div class="bg-bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<div class="register-container glass">

    <!-- LOGO -->
    <div class="logo-wrapper">
        <img src="../assets/images/marryMateLogo.png" alt="MarryMate Logo" class="logo">
    </div>

    <h2>Create Account</h2>
    <p class="sub-text">Join MarryMate and start planning your dream wedding</p>

    <form id="registerForm">
        <!-- Full Name with Icon -->
        <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="name" placeholder="Full Name" required>
        </div>

        <!-- Email with Icon -->
        <div class="input-group">
            <i class="far fa-envelope input-icon"></i>
            <input type="email" id="email" placeholder="Email Address" required>
        </div>

        <!-- Phone with Icon -->
        <div class="input-group">
            <i class="fas fa-phone-alt input-icon"></i>
            <input type="tel" id="phone" placeholder="Phone Number" required>
        </div>

        <!-- Address with Icon -->
        <div class="input-group">
            <i class="fas fa-map-marker-alt input-icon"></i>
            <input type="text" id="address" placeholder="Address" required>
        </div>

        <!-- Birthday with Icon -->
        <div class="input-group">
            <i class="fas fa-calendar-alt input-icon"></i>
            <input type="date" id="birthday" required>
        </div>

    <!-- Password with Icon and Toggle -->
    <div class="input-group">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" id="password" placeholder="Password" required>
        <button type="button" class="password-toggle" id="togglePassword">
            <i class="far fa-eye"></i>
        </button>
    </div>

    <!-- Confirm Password with Icon and Toggle -->
    <div class="input-group">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <button type="button" class="password-toggle" id="toggleConfirmPassword">
            <i class="far fa-eye"></i>
        </button>
    </div>

        <!-- Terms and Conditions -->
        <div class="terms-group">
            <label class="checkbox-container">
                <input type="checkbox" id="terms" required>
                <span class="checkmark"></span>
                <span class="terms-text">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
            </label>
        </div>

        <!-- Error Message -->
        <p class="error-message" id="errorMessage"></p>

        <!-- Success Message -->
        <p class="success-message" id="successMessage"></p>

        <!-- Register Button -->
        <button type="submit" class="register-btn" id="registerBtn">
            <span>Create Account</span>
            <i class="fas fa-arrow-right"></i>
        </button>
    </form>

    <!-- Divider -->
    <div class="divider">
        <span>or</span>
    </div>

    <!-- GOOGLE LOGIN -->
    <button class="google-btn" id="googleBtn">
        <i class="fab fa-google"></i>
        Continue with Google
    </button>

    <p class="login-text">
        Already have an account?
        <a href="login.html">Sign In</a>
    </p>

</div>

<script src="../assets/js/register.js"></script>

</body>
</html>
